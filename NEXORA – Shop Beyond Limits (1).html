'Australia':{c:'AUD',l:'en',tax:.1,tn:'GST',sh:16,d:'7–10',pay:CARD},'Canada':{c:'CAD',l:'en',tax:.13,tn:'HST',sh:13,d:'5–8',pay:CARD},
'Antarctica':{c:'USD',l:'en',tax:0,tn:'Tax',sh:0,d:'—',pay:[],no:1}};

es:{search:'Buscar productos, marcas, categorías…',go:'Buscar',login:'Iniciar sesión',explore:'Explorar catálogo',cats:'Categorías destacadas',trend:'Tendencias',flash:'Venta flash',add:'Añadir al carrito',sold:'Agotado',cart:'Carrito',checkout:'Pagar',place:'Realizar pedido'},
fr:{search:'Rechercher produits, marques, catégories…',go:'Rechercher',login:'Connexion',explore:'Découvrir le catalogue',cats:'Catégories à la une',trend:'Tendances',flash:'Vente flash',add:'Ajouter au panier',sold:'Épuisé',cart:'Panier',checkout:'Paiement',place:'Passer commande'},

hi:{search:'उत्पाद, ब्रांड, श्रेणियाँ खोजें…',go:'खोजें',login:'लॉग इन',explore:'कैटलॉग देखें',cats:'प्रमुख श्रेणियाँ',trend:'ट्रेंडिंग',flash:'फ्लैश सेल',add:'कार्ट में जोड़ें',sold:'स्टॉक खत्म',cart:'कार्ट',checkout:'चेकआउट',place:'ऑर्डर करें'},

const P0=[];let k=0;CATS.forEach(([c,e])=>NM[c].forEach(n=>{k++;P0.push({id:k,name:n,cat:c,emoji:e,brand:BR[k%5],price:12+((k*37)%25)*9+(c==='Electronics'?160:0),off:[0,10,15,20,25][k%5],rating:+(3.8+((k*7)%12)/10).toFixed(1),rc:40+k*17,stock:3+((k*13)%40)})}));

function App(){
const [view,setView]=useState({n:'home'}),[prods,setProds]=useState(()=>ld('prods',P0)),[cart,setCart]=useState(()=>ld('cart',{})),[wish,setWish]=useState(()=>ld('wish',[])),[user,setUser]=useState(()=>ld('user',null)),
[theme,setTheme]=useState(()=>ld('theme',matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')),[cur,setCur]=useState(()=>ld('cur','USD')),
[orders,setOrders]=useState(()=>ld('orders',SEED)),[tix,setTix]=useState(()=>ld('tix',[])),[rv,setRv]=useState(()=>ld('rv',[])),
[q,setQ]=useState(''),[modal,setModal]=useState(null),[toast,setToast]=useState(''),[cp,setCp]=useState(''),[coupon,setCoupon]=useState(null),
[f,setF]=useState({cat:'All',max:1000,rate:0,stock:false,sort:'rel'}),[tab,setTab]=useState('orders'),[pay,setPay]=useState('UPI'),[ctry,setCtry]=useState(()=>ld('ctry','India')),[lang,setLang]=useState(()=>ld('lang','en')),
[load,setLoad]=useState(true),[otp,setOtp]=useState(false),[left,setLeft]=useState(10800);
useEffect(()=>{document.documentElement.dataset.theme=theme;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';[['ctry',ctry],['lang',lang],['theme',theme],['cur',cur],['prods',prods],['cart',cart],['wish',wish],['user',user],['orders',orders],['tix',tix],['rv',rv]].forEach(a=>sv(...a))});
useEffect(()=>{const t=setTimeout(()=>setLoad(false),700),i=setInterval(()=>setLeft(l=>l>0?l-1:10800),1000);return()=>{clearTimeout(t);clearInterval(i)}},[]);
const pr=id=>prods.find(p=>p.id===id)||{id,name:'Removed item',emoji:'❔',price:0,off:0,stock:0,cat:''};
const fm=u=>SYM[cur]+(u*RATE[cur]).toLocaleString(undefined,{maximumFractionDigits:['INR','JPY'].includes(cur)?0:2});
const C=CT[ctry]||CT.India,T=k=>(I18N[lang]||{})[k]||I18N.en[k]||k;

const sub=ids.reduce((s,i)=>s+fin(pr(i))*cart[i],0),disc=coupon==='NEXORA10'?sub*.1:0,ship=!ids.length||sub>=100||coupon==='FREESHIP'?0:8,intl=!ids.length?0:C.sh,tax=(sub-disc)*C.tax,total=sub-disc+ship+intl+tax;
const ot=o=>o.items.reduce((s,i)=>s+fin(pr(i.id))*i.q,0);

const Card=p=>html`<div class=card key=${p.id}><button class=heart onClick=${()=>tw(p.id)}>${wish.includes(p.id)?'♥':'♡'}</button>
<div class=img style=${bg(p)} onClick=${()=>{setRv(r=>[p.id,...r.filter(x=>x!==p.id)].slice(0,6));go('pd',{id:p.id})}}>${p.emoji}</div>

return html`<div class=layout><div class=panel style=${{alignSelf:'start'}}><b>Filters</b><label>Category</label><select value=${f.cat} onChange=${e=>setF({...f,cat:e.target.value})}><option>All</option>${CATS.map(c=>html`<option key=${c[0]}>${c[0]}</option>`)}</select>

<div style=${{fontSize:30,fontWeight:800,margin:'8px 0'}}>${fm(fin(p))}${p.off?html`<span class=old>${fm(p.price)}</span><span class=off>${p.off}% off</span>`:''}</div>
<div class=${'tag '+(p.stock>0?'ok':'')}>${p.stock>0?`In stock (${p.stock} left)`:'Out of stock'}</div><p class=m>${C.no?'🚫 Delivery unavailable to '+ctry:'🚚 Delivery to '+ctry+': '+C.d+' business days · Free shipping over '+fm(100)}</p>
<p>Engineered for people who want more. Premium materials, 2-year warranty and 30-day easy returns.</p><div class=row><button class=btn disabled=${!p.stock} onClick=${()=>add(p.id)}>${T('add')}</button><button class="btn g" onClick=${()=>{add(p.id);setModal('cart')}}>Buy now</button><button class="btn g" onClick=${()=>tw(p.id)}>${wish.includes(p.id)?'♥ Wishlisted':'♡ Wishlist'}</button></div>
<h3>Specifications</h3><table><tbody>${[['Brand',p.brand],['Category',p.cat],['Warranty','2 years'],['SKU','NX-'+(1000+p.id)],['Ships from','Global hub']].map(r=>html`<tr key=${r[0]}><td class=m>${r[0]}</td><td>${r[1]}</td></tr>`)}</tbody></table></div></div>
<h2>Customer reviews</h2><div class=grid>${REV.map(r=>html`<div class=panel key=${r[0]}><div style=${{color:'#f5b301'}}>${stars(r[1])}</div>${r[2]}<div class=m>${r[0]}</div></div>`)}</div>
<h2>FAQs</h2><div class=panel><b>Is international shipping available?</b><div class=m>Yes, to 100+ countries (simulated rates).</div><p><b>Can I return it?</b><div class=m>Within 30 days from the Orders page.</div></p></div>
<h2>Related products</h2>${Grid(rel)}`};

const place=()=>{if(!user)return setModal('auth');const o={id:'NX-'+(10000+Math.floor(Math.random()*89999)),date:new Date().toISOString().slice(0,10),items:ids.map(i=>({id:i,q:cart[i]})),stage:0,ret:null};
setProds(ps=>ps.map(p=>cart[p.id]?{...p,stock:Math.max(0,p.stock-cart[p.id])}:p));setOrders([o,...orders]);setCart({});setCoupon(null);tt('Order '+o.id+' placed (simulated)');setTab('orders');go('acct')};
const checkout=()=>html`<div class=two><div><div class=panel><h3>Shipping address</h3><label>Full name</label><input defaultValue=${user?user.name:''}/><label>Address</label><input placeholder="Street, city, postal code"/><label>Country · ${C.no?'🚫 delivery unavailable':'delivery '+C.d+' days'} · ${C.tn} ${Math.round(C.tax*100)}%</label><select value=${ctry} onChange=${e=>setRegion(e.target.value)}>${Object.keys(CT).map(c=>html`<option key=${c}>${c}</option>`)}</select></div>
<div class=panel style=${{marginTop:14}}><h3>Payment <span class=tag>simulated · no real charge</span></h3>${C.pay.map(m=>html`<label key=${m} style=${{color:'var(--t)'}}><input type=radio style=${{width:'auto'}} checked=${pay===m} onChange=${()=>setPay(m)}/> ${m}</label>`)}<p class=m>In production, hosted Razorpay/Stripe checkout is used. Raw card details are never stored.</p></div></div>
<div class=panel style=${{alignSelf:'start'}}><h3>Order summary</h3>${ids.map(i=>html`<div class=row key=${i} style=${{justifyContent:'space-between'}}><span>${pr(i).name} × ${cart[i]}</span><span>${fm(fin(pr(i))*cart[i])}</span></div>`)}<hr/>
<div class=row style=${{justifyContent:'space-between'}}><span>Subtotal</span>${fm(sub)}</div>${disc?html`<div class=row style=${{justifyContent:'space-between'}}><span>Coupon</span>-${fm(disc)}</div>`:''}<div class=row style=${{justifyContent:'space-between'}}><span>Shipping</span>${ship+intl?fm(ship+intl):'Free'}</div><div class=row style=${{justifyContent:'space-between'}}><span>${C.tn} (${Math.round(C.tax*100)}%)</span>${fm(tax)}</div>
<div class=row style=${{justifyContent:'space-between',fontWeight:800,fontSize:18}}><span>Total</span>${fm(total)}</div><button class=btn style=${{width:'100%',marginTop:12}} disabled=${!ids.length||C.no} onClick=${place}>${C.no?'Delivery unavailable':T('place')+' ('+pay+')'}</button></div></div>`;

const acct=()=>{if(!user)return html`<div class=panel>Please log in. <button class=btn onClick=${()=>setModal('auth')}>Log in</button></div>`;
return html`<h2 style=${{marginTop:0}}>Hello, ${user.name}</h2><div class=tabs>${[['orders','Orders & tracking'],['wish','Wishlist'],['support','Support'],['profile','Profile']].map(t=>html`<button key=${t[0]} class="btn sm ${tab===t[0]?'':'g'}" onClick=${()=>setTab(t[0])}>${t[1]}</button>`)}</div>
${tab==='orders'?(orders.length?orders.map(o=>html`<div class=panel key=${o.id} style=${{marginBottom:12}}><div class=row style=${{justifyContent:'space-between'}}><b>${o.id}</b><span class=m>${o.date} · ${fm(ot(o))}</span></div><div class=m>${o.items.map(i=>pr(i.id).name+' ×'+i.q).join(', ')}</div>
<div class=tl>${STG.map((s,i)=>html`<div key=${s} class=${i<=o.stage?'on':''}>${s}</div>`)}</div><div class=row><span class=tag>🔔 Notification (simulated): ${STG[o.stage]}</span>
<button class="btn g sm" onClick=${()=>{const w=window.open('','_blank');if(w){w.document.write('<h2>NEXORA Invoice '+o.id+'</h2><p>Total: '+fm(ot(o))+'</p><p>Demo invoice</p>');w.document.close()}else tt('Allow popups for invoice')}}>Invoice</button>
${o.stage<2&&!o.ret?html`<button class="btn g sm" onClick=${()=>{setOrders(orders.map(x=>x===o?{...o,ret:'Cancelled'}:x));tt('Cancellation requested')}}>Cancel</button>`:''}
${o.stage===4&&!o.ret?html`<button class="btn g sm" onClick=${()=>{setOrders(orders.map(x=>x===o?{...o,ret:'Return requested'}:x));tt('Return requested')}}>Return / refund</button>`:''}${o.ret?html`<span class=tag>${o.ret}</span>`:''}</div></div>`):html`<div class=panel>No orders yet.</div>`):''}
${tab==='wish'?(wish.length?Grid(wish.map(pr)):html`<div class=panel>Your wishlist is empty.</div>`):''}
${tab==='support'?html`<div class=panel><form onSubmit=${e=>{e.preventDefault();setTix([{id:'T-'+(100+tix.length),s:e.target.s.value,st:'Open'},...tix]);e.target.reset();tt('Ticket created')}}><input name=s required placeholder="Describe your issue"/><button class=btn style=${{marginTop:8}}>Create ticket</button></form>${tix.map(t=>html`<p key=${t.id}><b>${t.id}</b> ${t.s} <span class=tag>${t.st}</span></p>`)}</div>`:''}
${tab==='profile'?html`<div class=panel><label>Email</label><input readOnly value=${user.email}/><label>Saved address</label><input placeholder="Add address"/><p class=m>Security: password reset & 2FA via Supabase Auth in production.</p></div>`:''}`};

const admin=()=>{if(!user||!user.admin)return html`<div class=panel>Admin only. Log in with <b>admin@nexora.demo</b> (any password).</div>`;
const rev=orders.reduce((s,o)=>s+ot(o),0);return html`<h2 style=${{marginTop:0}}>Admin dashboard <span class=tag>demo data</span></h2><div class=grid>${[['Revenue',fm(rev)],['Orders',orders.length],['Products',prods.length],['Low stock',prods.filter(p=>p.stock<8).length]].map(s=>html`<div class=panel key=${s[0]}><div class=m>${s[0]}</div><div style=${{fontSize:26,fontWeight:800}}>${s[1]}</div></div>`)}</div>
<h2>Orders</h2><div class="panel tbl"><table><tbody>${orders.map(o=>html`<tr key=${o.id}><td>${o.id}</td><td>${fm(ot(o))}</td><td>${STG[o.stage]}${o.ret?' · '+o.ret:''}</td><td class=row>${o.stage<4?html`<button class="btn sm" onClick=${()=>setOrders(orders.map(x=>x===o?{...o,stage:o.stage+1}:x))}>Advance</button>`:''}${o.ret==='Return requested'?html`<button class="btn sm g" onClick=${()=>setOrders(orders.map(x=>x===o?{...o,ret:'Refunded'}:x))}>Approve refund</button>`:''}</td></tr>`)}</tbody></table></div>
<h2>Inventory <button class="btn sm" onClick=${()=>setProds([...prods,{...P0[0],id:Math.max(...prods.map(p=>p.id))+1,name:'New Product',stock:10}])}>+ Add product</button></h2><div class="panel tbl"><table><tbody>${prods.map(p=>html`<tr key=${p.id}><td>${p.emoji} ${p.name}</td><td>${fm(fin(p))}</td><td class=row><button class="btn g sm" onClick=${()=>setProds(prods.map(x=>x.id===p.id?{...x,stock:Math.max(0,x.stock-1)}:x))}>−</button>${p.stock}<button class="btn g sm" onClick=${()=>setProds(prods.map(x=>x.id===p.id?{...x,stock:x.stock+1}:x))}>+</button></td><td><button class="btn d sm" onClick=${()=>setProds(prods.filter(x=>x.id!==p.id))}>Delete</button></td></tr>`)}</tbody></table></div>`};

const auth=()=>html`<div class=ov onClick=${()=>setModal(null)}><div class=mod onClick=${e=>e.stopPropagation()}><h3>Welcome to NEXORA <span class=tag>simulated auth</span></h3>
<form onSubmit=${e=>{e.preventDefault();const em=e.target.em.value;if(otp&&e.target.o&&e.target.o.value!=='123456')return tt('Wrong OTP (use 123456)');setUser({name:em.split('@')[0]||'Shopper',email:em,admin:em==='admin@nexora.demo'});setModal(null);tt('Logged in')}}>
<input name=em required placeholder=${otp?'+91 98765 43210':'Email'} type=${otp?'tel':'email'}/>${otp?html`<input name=o required placeholder="OTP: 123456" style=${{marginTop:8}}/>`:html`<input type=password required placeholder="Password" style=${{marginTop:8}}/>`}
<button class=btn style=${{width:'100%',marginTop:10}}>${otp?'Verify OTP':'Log in / Register'}</button></form>
<div class=row style=${{marginTop:10}}><button class="btn g sm" onClick=${()=>setOtp(!otp)}>${otp?'Use email':'Phone OTP'}</button><button class="btn g sm" onClick=${()=>{setUser({name:'Google User',email:'user@gmail.com'});setModal(null)}}>Google</button><button class="btn g sm" onClick=${()=>tt('Reset link sent (simulated)')}>Forgot password</button></div></div></div>`;

const cartUI=()=>html`<div class=ov style=${{placeItems:'stretch end',padding:0}} onClick=${()=>setModal(null)}><div class=drawer onClick=${e=>e.stopPropagation()}><div class=row style=${{justifyContent:'space-between'}}><h3>${T('cart')} (${ids.length})</h3><button class="btn g sm" onClick=${()=>setModal(null)}>✕</button></div>
${ids.map(i=>html`<div class=panel key=${i} style=${{marginBottom:8}}><div>${pr(i).emoji} ${pr(i).name}</div><div class=row style=${{justifyContent:'space-between'}}><span class=pr>${fm(fin(pr(i))*cart[i])}</span><span class=row><button class="btn g sm" onClick=${()=>setCart({...cart,[i]:cart[i]-1})}>−</button>${cart[i]}<button class="btn g sm" onClick=${()=>add(i)}>+</button><button class="btn d sm" onClick=${()=>setCart({...cart,[i]:0})}>✕</button></span></div></div>`)}
${ids.length?html`<div class=row><input placeholder="Coupon: NEXORA10 / FREESHIP" value=${cp} onChange=${e=>setCp(e.target.value.toUpperCase())} style=${{flex:1}}/><button class="btn g sm" onClick=${()=>{['NEXORA10','FREESHIP'].includes(cp)?(setCoupon(cp),tt('Coupon applied')):tt('Invalid coupon')}}>Apply</button></div>
<p>Subtotal ${fm(sub)}${disc?` · Coupon −${fm(disc)}`:''}<br/>Shipping ${ship?fm(ship):'Free'} · Total <b>${fm(total)}</b></p><button class=btn style=${{width:'100%'}} onClick=${()=>go('checkout')}>${T('checkout')}</button>`:html`<p class=m>Your cart is empty.</p>`}</div></div>`;

return html`<div><div class=sim><b>PROTOTYPE</b> Payments, OTP, tracking, notifications & AI picks are simulated. No real transactions occur.</div>
<header><div class=nav><span class=logo onClick=${()=>go('home')}>NEXORA</span>
<form class=search onSubmit=${e=>{e.preventDefault();go('shop')}}><input list=sg placeholder=${T('search')} value=${q} onChange=${e=>setQ(e.target.value)}/><datalist id=sg>${prods.slice(0,40).map(p=>html`<option key=${p.id} value=${p.name}/>`)}</datalist><button class=btn>${T('go')}</button></form>
<select style=${{width:130}} title=Country value=${ctry} onChange=${e=>setRegion(e.target.value)}>${Object.keys(CT).map(c=>html`<option key=${c}>${c}</option>`)}</select><select style=${{width:105}} title=Language value=${lang} onChange=${e=>setLang(e.target.value)}>${Object.keys(LN).map(c=>html`<option key=${c} value=${c}>${LN[c]}</option>`)}</select><select style=${{width:80}} title=Currency value=${cur} onChange=${e=>setCur(e.target.value)}>${Object.keys(RATE).map(c=>html`<option key=${c}>${c}</option>`)}</select>
<button class=ic onClick=${()=>setTheme(theme==='dark'?'light':'dark')}>${theme==='dark'?'☀️':'🌙'}</button>
<button class=ic onClick=${()=>{setTab('wish');go('acct')}}>♡${wish.length?html`<i>${wish.length}</i>`:''}</button>
<button class=ic onClick=${()=>setModal('cart')}>🛒${ids.length?html`<i>${ids.reduce((s,i)=>s+cart[i],0)}</i>`:''}</button>
${user?html`<button class="btn g sm" onClick=${()=>{setTab('orders');go('acct')}}>👤 ${user.name}</button>${user.admin?html`<button class="btn sm" onClick=${()=>go('admin')}>Admin</button>`:''}<button class="btn g sm" onClick=${()=>setUser(null)}>Log out</button>`:html`<button class=btn onClick=${()=>setModal('auth')}>${T('login')}</button>`}</div></header>
<main>${{home,shop,pd,checkout,acct,admin}[view.n]()}</main>
<footer><b>NEXORA</b> — Shop Beyond Limits<br/>${Object.keys(CT).length-1} delivery regions · ${Object.keys(I18N).length} languages · ${Object.keys(RATE).length} currencies · Demo content only</footer>
${modal==='auth'?auth():''}${modal==='cart'?cartUI():''}${toast?html`<div class=toast>${toast}</div>`:''}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
